name: Publicação do site (GitHub Pages)

on:
  push:
    branches:
      - master

  # O commit automático do update-data.yml usa o GITHUB_TOKEN padrão pra dar
  # push — e por design do GitHub Actions, push feito com esse token não
  # dispara outros workflows via "on: push" (evita loop infinito). workflow_run
  # escuta o término do update-data.yml independente de quem/como ele rodou,
  # então o deploy dispara mesmo quando é o cron que atualiza os dados.
  # ATENÇÃO: workflow_run casa pelo NOME do workflow. Renomear qualquer um
  # dos três abaixo sem mexer aqui faz o site parar de publicar dado novo,
  # silenciosamente — os jobs continuam verdes.
  workflow_run:
    workflows:
      - "Performance da raide (WCL + Wipefest + Wowhead)"
      - "Stats do roster (Raider.IO + WCL)"
      - "Referência de preparação (Wowhead)"
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Dois deploys sobrepostos publicam por ordem de TÉRMINO, não de commit. Com
# cancel-in-progress: false o build antigo continuava e vencia: o push e o
# workflow_run do cron de dados chegaram com 1 minuto de diferença e o site
# ficou com o dado velho, mesmo os dois tendo passado. O mais novo agora
# cancela o que estiver em voo.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sempre a ponta da master, nunca um SHA fixo. Em workflow_run o
          # head_sha é o commit de ANTES do cron commitar os dados — o deploy
          # construía o código novo com o dado velho e o site ficava uma
          # atualização atrasada, sem nenhum workflow falhar.
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build with Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  lighthouse:
    name: Lighthouse CI
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          # page_url do deploy-pages vem como http:// enquanto "Enforce HTTPS"
          # não estiver ligado nas configurações de Pages do repo (o domínio
          # custom já serve https normalmente, só falta essa flag) — isso
          # fazia o audit is-on-https falhar (1 request "inseguro": a
          # navegação inicial). Forçamos https:// aqui pra refletir o site
          # real; ainda assim vale ligar o "Enforce HTTPS" no GitHub.
          urls: |
            https://hailtotheking.com.br/
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
