name: Update Performance Data

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Número da semana (ex: 3). Deixe em branco pra calcular sozinho a partir de raidWeekAnchor."
        required: false
        type: string
      start:
        description: "Data de início da janela (YYYY-MM-DD). Deixe em branco para usar 'days' a partir de agora."
        required: false
        type: string
      end:
        description: "Data de fim da janela (YYYY-MM-DD). Só é usada junto com 'start'."
        required: false
        type: string
      days:
        description: "Janela em dias a partir de agora (usada quando 'start' não é informado)"
        required: false
        type: string
        default: "7"
      reports:
        description: "Códigos de report manuais, separados por vírgula (reforço para logs unlisted/pessoais)"
        required: false
        type: string
      include_guild_reports:
        description: "Também buscar reports marcados com a guild (não só o upload pessoal do Thiago). Modo investigação — pode trazer log de gente que não é do core."
        required: false
        type: boolean
        default: false
  schedule:
    # Checa todo dia se o Thiago subiu log novo — se não tiver nada de novo,
    # o script não escreve nada e o passo de commit não faz nada (ver
    # "Nada para commitar" abaixo). Cedo o bastante em UTC pra já ter passado
    # de qualquer raid que tenha ido até a virada da noite no horário do Brasil.
    - cron: "0 10 * * *"

permissions:
  contents: write

# Duas execuções ao mesmo tempo commitariam em cima uma da outra. Não
# cancela a que já está rodando: ela pode estar no meio de um push.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    name: Fetch & Commit
    runs-on: ubuntu-latest
    env:
      # ID de conta WCL de quem sobe os logs de raid (não é dado sensível,
      # é só um ID numérico de conta). Ver scripts/warcraftlogs/fetch-performance.ts.
      WCL_UPLOADER_USER_IDS: "922357"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch performance data from WarcraftLogs
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_REPORTS: ${{ inputs.reports }}
          INPUT_INCLUDE_GUILD_REPORTS: ${{ inputs.include_guild_reports }}
        run: |
          ARGS=()

          if [ -n "$INPUT_WEEK" ]; then
            ARGS+=(--week="$INPUT_WEEK")
          fi

          if [ -n "$INPUT_START" ]; then
            ARGS+=(--start="$INPUT_START" --end="$INPUT_END")
          else
            ARGS+=(--days="${INPUT_DAYS:-7}")
          fi

          if [ -n "$INPUT_REPORTS" ]; then
            ARGS+=(--reports="$INPUT_REPORTS")
          fi

          if [ "$INPUT_INCLUDE_GUILD_REPORTS" = "true" ]; then
            ARGS+=(--include-guild-reports)
          fi

          npx vite-node -c vitest.config.ts scripts/warcraftlogs/fetch-performance.ts "${ARGS[@]}"

      # Depois do passo acima, porque escreve no MESMO week-NN.json que ele
      # acabou de gerar — precisa dos reportCode. Por isso é um passo daqui e
      # não um workflow à parte: separado, exigiria encadear workflows e
      # geraria um segundo commit.
      #
      # Sem credencial e sem navegador: a API do Wipefest é pública. Sem
      # --week de propósito — a semana sai do raidWeekAnchor, igual acima.
      - name: Fetch mechanic errors from Wipefest
        env:
          INPUT_WEEK: ${{ inputs.week }}
        run: |
          ARGS=()
          if [ -n "$INPUT_WEEK" ]; then
            ARGS+=(--week="$INPUT_WEEK")
          fi

          npm run wipefest:fetch-mechanics -- "${ARGS[@]}"

      - name: Run tests
        run: npm test

      - name: Build site (valida que os dados gerados não quebram o build)
        run: npm run build

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weekly/performance/week-*.json data/guild/roster.json "data/seasons/*/config.json" "data/seasons/*/cooldown-catalog.json"

          if git diff --cached --quiet; then
            echo "Nada para commitar."
          else
            git commit -m "chore(data): atualização automática de log de raid (WarcraftLogs + Wipefest)"
            git push
          fi
