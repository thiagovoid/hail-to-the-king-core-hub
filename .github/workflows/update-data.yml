name: Update Performance Data

on:
  # Raids são terça e quinta à noite (BRT). Roda quarta e sexta de manhã
  # (09:00 UTC = 06:00 BRT), com folga pros logs terem sido subidos.
  schedule:
    - cron: "0 9 * * 3,5"

  workflow_dispatch:
    inputs:
      week:
        description: "Forçar número da semana (ex: 3). Em branco = derivado da data de cada report."
        required: false
        type: string
      start:
        description: "Data de início da janela (YYYY-MM-DD). Deixe em branco para usar 'days' a partir de agora."
        required: false
        type: string
      end:
        description: "Data de fim da janela (YYYY-MM-DD). Só é usada junto com 'start'."
        required: false
        type: string
      days:
        description: "Janela em dias a partir de agora (usada quando 'start' não é informado)"
        required: false
        type: string
        default: "7"
      reports:
        description: "Códigos de report manuais, separados por vírgula (reforço para logs unlisted/pessoais)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    name: Fetch & Commit
    runs-on: ubuntu-latest
    env:
      # ID de conta WCL de quem sobe os logs de raid (não é dado sensível,
      # é só um ID numérico de conta). Ver scripts/warcraftlogs/discover-reports.ts.
      WCL_UPLOADER_USER_IDS: "922357"
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
      # No cron não há inputs: janela curta (3 dias) cobre a última raid.
      INPUT_WEEK: ${{ inputs.week }}
      INPUT_START: ${{ inputs.start }}
      INPUT_END: ${{ inputs.end }}
      INPUT_DAYS: ${{ inputs.days || '3' }}
      INPUT_REPORTS: ${{ inputs.reports }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build script args
        id: args
        run: |
          ARGS=()
          if [ -n "$INPUT_START" ]; then
            ARGS+=(--start="$INPUT_START" --end="$INPUT_END")
          else
            ARGS+=(--days="$INPUT_DAYS")
          fi
          if [ -n "$INPUT_REPORTS" ]; then
            ARGS+=(--reports="$INPUT_REPORTS")
          fi
          echo "common=${ARGS[*]}" >> "$GITHUB_OUTPUT"

      - name: Fetch performance data from WarcraftLogs (dps/parse por run)
        run: |
          ARGS=(${{ steps.args.outputs.common }})
          if [ -n "$INPUT_WEEK" ]; then
            ARGS+=(--week="$INPUT_WEEK")
          fi
          npx vite-node -c vitest.config.ts scripts/warcraftlogs/fetch-performance.ts "${ARGS[@]}"

      - name: Update season (pulls/kills por boss + últimos logs)
        run: |
          ARGS=(${{ steps.args.outputs.common }})
          npx vite-node -c vitest.config.ts scripts/warcraftlogs/update-season.ts "${ARGS[@]}"

      - name: Run tests
        run: npm test

      - name: Build site (valida que os dados gerados não quebram o build)
        run: npm run build

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weekly/performance/week-*.json data/guild/roster.json data/seasons/*/config.json

          if git diff --cached --quiet; then
            echo "Nada para commitar."
          else
            git commit -m "chore(data): atualiza performance e progressão via WarcraftLogs"
            git push
          fi
