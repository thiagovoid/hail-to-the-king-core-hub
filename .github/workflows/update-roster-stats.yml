name: Stats do roster (Raider.IO + WCL)

on:
  # Raider.IO (IO, melhor key, rank) e parse médio/attendance da WCL mudam
  # ao longo da semana toda — uma vez por dia de manhã (09:30 UTC = 06:30 BRT).
  schedule:
    # Meia-noite de Brasília.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Pra chamar o deploy no fim (ver "Publicar o site"). Push feito com o
  # GITHUB_TOKEN não dispara "on: push", e o workflow_run do deploy.yml parou
  # de casar com este job desde a renomeação de 18/09 — mas workflow_dispatch
  # disparado pelo GITHUB_TOKEN é a exceção documentada que funciona.
  actions: write

concurrency:
  group: update-roster-stats
  cancel-in-progress: false

jobs:
  update-roster-stats:
    name: Sync roster stats & Commit
    runs-on: ubuntu-latest
    env:
      # Zone rankings (avgParse/bestParse) vêm da WCL; Raider.IO é API pública, sem chave.
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Só o roster do core (data/guild/roster.json), não a guild inteira —
      # o script itera esse arquivo e nada mais.
      - name: Sync Raider.IO + WarcraftLogs stats for the core roster
        run: npm run wcl:sync-roster-stats

      - name: Run tests
        run: npm test

      - name: Build site (valida que os dados gerados não quebram o build)
        run: npm run build

      - name: Commit roster
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/guild/roster.json

          if git diff --cached --quiet; then
            echo "Nada para commitar."
          else
            git commit -m "chore(data): atualiza stats do roster (Raider.IO / WarcraftLogs)"
            # Rebase antes do push: se alguém empurrou pra master enquanto
            # o job rodava, o push é rejeitado e o commit de dados morre com
            # o runner — o job falha DEPOIS de já ter coletado tudo. Foi o
            # que aconteceu na coleta de 18/09.
            git pull --rebase origin master
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Chama o deploy direto, em vez de esperar o workflow_run do deploy.yml.
      # Desde 18/09, quando este workflow ganhou o nome atual, o workflow_run
      # nunca mais disparou pra ele: os dados entravam no master e o site só
      # publicava quando OUTRO job (preparação, metas) terminava — o log de
      # 24/09 ficou fora do ar a noite toda com tudo verde.
      - name: Publicar o site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master
