name: Diagnóstico de log (WCL)

# Não tem cron de propósito: é ferramenta de investigação, rodada à mão
# quando algum número do site não bate com o log. As credenciais da WCL só
# existem aqui como secret, então é o único lugar onde dá pra olhar o dado
# cru sem colocar credencial na máquina de ninguém.
on:
  workflow_dispatch:
    inputs:
      report:
        description: "Código do report na WarcraftLogs (ex: JCvk27bDL6Zdm18j)"
        required: true
        type: string
      tool:
        description: "Qual diagnóstico rodar"
        required: true
        default: roles
        type: choice
        options:
          - roles
          - preparation
          - parse
          - cooldowns
          - healing
          - trash
          - gear
          - raw-size
          - mortes
      player:
        description: "Filtrar por jogador (opcional, casa por trecho do nome)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Diagnóstico
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Só lê e imprime. Não grava nada no repositório.
      - name: Inspecionar papéis por fight
        if: inputs.tool == 'roles'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: |
          ARGS=(--report="${{ inputs.report }}")
          if [ -n "${{ inputs.player }}" ]; then
            ARGS+=(--player="${{ inputs.player }}")
          fi
          npm run wcl:inspect-roles -- "${ARGS[@]}"

      - name: Inspecionar preparação (gear/gemas/encantos/auras crus)
        if: inputs.tool == 'preparation'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: |
          ARGS=(--report="${{ inputs.report }}")
          if [ -n "${{ inputs.player }}" ]; then
            ARGS+=(--player="${{ inputs.player }}")
          fi
          npm run wcl:inspect-preparation -- "${ARGS[@]}"

      - name: Inspecionar parse (ranks por dificuldade)
        if: inputs.tool == 'parse'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: npm run wcl:inspect-parse -- --report="${{ inputs.report }}"

      - name: Inspecionar cooldowns (por que a habilidade entrou ou saiu)
        if: inputs.tool == 'cooldowns'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: |
          ARGS=(--report="${{ inputs.report }}")
          if [ -n "${{ inputs.player }}" ]; then
            ARGS+=(--player="${{ inputs.player }}")
          fi
          npm run wcl:inspect-cooldowns -- "${ARGS[@]}"

      - name: Inspecionar cura e dano recebido do raide
        if: inputs.tool == 'healing'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: npm run wcl:inspect-healing -- --report="${{ inputs.report }}"

      - name: Inspecionar lutas de trash
        if: inputs.tool == 'trash'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          PROBE_REPORT: ${{ inputs.report }}
        run: npm run wcl:inspect-trash

      - name: Inspecionar equipamento e encantos
        if: inputs.tool == 'gear'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          PROBE_REPORT: ${{ inputs.report }}
        run: npm run wcl:inspect-gear

      - name: Medir o tamanho do dado bruto
        if: inputs.tool == 'raw-size'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          PROBE_REPORT: ${{ inputs.report }}
        run: npm run wcl:inspect-raw-size

      - name: Separar morte que custa de call de wipe
        if: inputs.tool == 'mortes'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          PROBE_REPORT: ${{ inputs.report }}
        run: npm run wcl:inspect-mortes
